# Checks every change: the "Done means" list in docs/HANDOFF.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The workspace, which includes the native UI (gui/ turns on the "gui"
  # feature), and the CLI on its own, which must build without iced.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the native UI's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency security
        run: |
          # lru is locked through iced's optional wgpu renderer, which we
          # don't build. Fail if it becomes selected on ANY platform.
          cargo tree --workspace --target all --locked -e normal,build,dev --prefix none > "$RUNNER_TEMP/ferry-dependencies.txt"
          if grep -q '^lru ' "$RUNNER_TEMP/ferry-dependencies.txt"; then
            echo "lru is now selected; revisit RUSTSEC-2026-0253 before shipping"
            exit 1
          fi
          # RSA public-key verification is needed for older Android peers;
          # core::payload rejects RSA private-key authentication, with a
          # regression test. Details and removal criteria for both narrowly
          # scoped exceptions: docs/DEPENDENCY_SECURITY.md.
          cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0253
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: The CLI builds without the UI
        run: |
          cargo build -p ferry --locked
          count=$(cargo tree -p ferry -e normal --locked --prefix none | grep -c '^iced' || true)
          if [ "$count" != 0 ]; then
            echo "iced is in the CLI's dependency tree"
            exit 1
          fi

  # Every dependency's license must be one about.toml accepts: the packages
  # ship their notices, and a new license needs a decision first.
  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9
      - run: cargo about generate --locked --fail about.hbs -o THIRD_PARTY_LICENSES.html
