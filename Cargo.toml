[workspace]
members = [".", "gui"]

[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
default-run = "ferry-cli"
license = "MIT"
publish = false

[features]
# The desktop UI: `src/ui/`. Off by default so the
# CLI and daemon build without iced; the `gui` crate turns it on.
gui = [
    "dep:chrono",
    "dep:display-info",
    "dep:fluent-bundle",
    "dep:fluent-syntax",
    "dep:i18n-embed",
    "dep:i18n-embed-fl",
    "dep:iced",
    "dep:iced_fonts",
    "dep:icu_calendar",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_locale_core",
    "dep:image",
    "dep:interprocess",
    "dep:ksni",
    "dep:libc",
    "dep:mac-usernotifications",
    "dep:mundy",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:opener",
    "dep:rfd",
    "dep:rust-embed",
    "dep:tray-icon",
    "dep:windows-registry",
    "dep:xcb",
    "dep:zbus",
]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
directories = "6"
futures-core = "0.3"
futures-util = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = { version = "0.18", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
gethostname = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# `ring` rather than the default aws-lc-rs: rustls already uses ring, and
# aws-lc-rs needs cmake and NASM to build on Windows.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
# The daemon's data (`store`), with SQLite built in so no platform needs
# a system library.
rusqlite = { version = "0.40", features = ["bundled"] }
# Its schema migrations (`src/store/migrations/`), embedded in the binary
# and versioned by `PRAGMA user_version`.
rusqlite_migration = { version = "2.6", features = ["from-directory"] }
include_dir = "0.7"
# The identity's certificate and key in its stored JSON; already in the tree.
base64 = "0.23"
# The desktop UI (`gui` feature). Upgrading iced is its own change.
# iced's default features minus `wgpu`: the app draws with tiny-skia on the
# CPU. Once a window had opened, wgpu kept the GPU driver stack (Vulkan,
# Mesa, LLVM) loaded after it closed: about 270 MB resident in the tray,
# against 35 MB with tiny-skia.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "advanced",
    "image-without-codecs",
], optional = true }
iced_fonts = { version = "0.3", features = ["lucide"], optional = true }
opener = { version = "0.8", features = ["reveal"], optional = true }
rfd = { version = "0.17", optional = true }
# Decodes previews, so one that can't be shown says so. iced renders
# images through the same crate; only the codecs the preview offers are on.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"], optional = true }
# Local time for file dates; already in the tree through russh-sftp.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
# Every monitor's bounds, for the saved window placement's fits-on-screen
# check; iced knows only the current monitor's size.
display-info = { version = "0.5", optional = true }
# The single-instance socket, named from the data dir.
interprocess = { version = "2.4", optional = true }
# Translations (`src/ui/i18n.rs`): Fluent files from `i18n/`, embedded
# with `rust-embed`, the system's languages through `desktop-requester`,
# and `fl!`, which checks keys and arguments against en-US at compile time.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"], optional = true }
i18n-embed-fl = { version = "0.10", optional = true }
rust-embed = { version = "8", optional = true }
# Numbers and dates in the user's locale (`ui::i18n::format`), from CLDR
# data compiled in; `icu_locale_core` is already in the tree through
# `url`. `fluent-bundle` (already in the tree through
# `i18n-embed`) is named to hand Fluent that number formatter.
icu_calendar = { version = "2.3", optional = true }
icu_datetime = { version = "2.3", optional = true }
icu_decimal = { version = "2.3", features = ["alloc", "ryu"], optional = true }
icu_locale_core = { version = "2.3", optional = true }
fluent-bundle = { version = "0.16", optional = true }
# Reads and writes `.ftl` files: the en-XA pseudo-locale is made from
# en-US's (`ui::i18n::pseudo`); already in the tree through `i18n-embed`.
fluent-syntax = { version = "0.12", optional = true }

[target.'cfg(unix)'.dependencies]
# The uid in the single-instance socket's name (`gui`).
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The tray (`gui`), over D-Bus. Both on async-io, as iced's theme detection
# already has zbus: its `tokio` feature would need a runtime on iced's
# threads.
ksni = { version = "0.3", default-features = false, features = ["async-io"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }
# Not used directly: `dl` makes `display-info` load libxcb at run time, as
# winit does, rather than link it, so the binary needs only libc.
xcb = { version = "1.7", features = ["dl"], optional = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# The tray (`gui`), with `muda` menus (re-exported as `tray_icon::menu`).
tray-icon = { version = "0.25", default-features = false, optional = true }
# The system's light or dark mode (`gui`), as it changes: iced hears of a
# change only through the window, whose appearance it pins to the app's
# theme. iced uses it on Linux; there iced's own detection works.
mundy = { version = "0.2", default-features = false, features = ["color-scheme"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Notifications (`gui`), through `UNUserNotificationCenter`: the crate
# `notify-rust` builds its macOS backend on, used directly for its async
# API, so a click and a withdrawal need no thread per notification.
mac-usernotifications = { version = "0.3.1", optional = true }
# The Dock icon (`gui`), shown only while the window is open, and files
# dropped on the menu bar icon. Already in the tree through `tray-icon`.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSDragging", "NSMenu", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSURL", "NSValue"], optional = true }

[target.'cfg(windows)'.dependencies]
# Starting on login (`gui`): a value under `HKCU\...\Run`. From windows-rs;
# its `windows-*` dependencies are already in the tree.
windows-registry = { version = "0.100", optional = true }

[[bin]]
# The command line: `ferry-cli run` is the daemon, every other command
# its client.
name = "ferry-cli"
path = "src/bin/ferry-cli/main.rs"

[[test]]
name = "ui_e2e"
required-features = ["gui"]

[[test]]
name = "i18n_switch"
required-features = ["gui"]

[dev-dependencies]
iced_runtime = "0.14"
iced_test = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
